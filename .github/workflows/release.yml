name: Release

# 发布路径:推送 v<version> 标签(或手动触发)后,在 CI 内完成
# 构建 → 包校验 → npm publish(禁用脚本,直接发布 CI 构建产物)。
# 消费者安装时不会执行任何生命周期脚本(issue #2)。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${pkg} expected, got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Install
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify publishable package
        run: node scripts/verify-package.cjs

      # --ignore-scripts: 发布的就是上面这步 CI 构建的产物,
      # 不再触发任何生命周期脚本;--provenance 为 npm 供应链签名
      - name: Publish
        run: npm publish --ignore-scripts --provenance --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
